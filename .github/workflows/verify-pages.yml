name: Verify GitHub Pages

# Weekly check that every version served on GitHub Pages is byte-identical to its
# published release. Fails loudly if anything was changed.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/verify-pwa.sh --all
